[package]
name = "s3-browser"
version = "0.1.0"
edition = "2024"
description = "A native S3 file browser for AWS and S3-compatible providers, built with GPUI Kit."
license = "MIT"
repository = "https://github.com/zf0x00/s3-browser"

[[bin]]
name = "s3-browser"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui-kit = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client", "sigv4a"] }
aws-smithy-types = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Thumbnails for the explorer grid (decode, EXIF-orient, downscale).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
# Cache keys.
sha2 = "0.10"

[dev-dependencies]
# tools/render_icon.rs: SVG → app icon PNGs (already in the tree via GPUI).
resvg = "0.45"

[[example]]
name = "render_icon"
path = "tools/render_icon.rs"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.11", features = ["runtime_shaders", "font-kit"] }
security-framework = "3"

[profile.dev.package."*"]
opt-level = 2
